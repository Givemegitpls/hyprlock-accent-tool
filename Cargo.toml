[package]
name = "hyprlock-accent"
version = "0.1.0"
edition = "2024"

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp"] }
fast_image_resize = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-5 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
